name: PrimarySBA UX/performance migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/primary-uxperf-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Assemble migration inputs
        shell: bash
        run: |
          cat tools/patch.part01 tools/patch.part02 tools/patch.part03 tools/patch.part04 tools/patch.part05 tools/patch.part06 tools/patch.part07 tools/patch.part08 > tools/source-format-patch-rich.json.gz.b64
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          p=Path("tools/migrate_primary.py.gz.b64")
          Path("tools/migrate_primary.py").write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          PY
      - name: Run migration
        run: python tools/migrate_primary.py
      - name: Clean temporary patch parts
        shell: bash
        run: |
          rm -f tools/patch.part*
          rm -f tools/migrate_primary.py.gz.b64
          rmdir tools 2>/dev/null || true
      - name: Validate generated app
        shell: bash
        run: |
          test ! -e index.html.bak
          test -f assets/app.js
          test -f assets/app.css
          test -f data/bank-index.json
          test -d figures
          node --check assets/app.js
          node --check service-worker.js
          python - <<'PY'
          import json
          q=json.load(open("data/bank-index.json"))
          assert len(q)==1102 and q[0]["id"]==1 and q[-1]["id"]==1102
          r=json.load(open("PRIMARY-UXPERF01-INTEGRITY.json"))
          assert r["original_payload_sha256"]=="12e1a2cd27ff3566937e6771aa8eab9fcc795f505d3e24be1c6c38880eebfd68"
          assert r["firebase_config_preserved"] is True
          assert r["figures_externalized"]==135
          print(json.dumps(r,indent=2))
          PY
      - name: Commit migrated site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade PrimarySBA UI, formatting and performance"
          git push origin HEAD:main
